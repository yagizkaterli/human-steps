<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" font-family="'Cascadia Code','Consolas',ui-monospace,monospace">
  <!-- RE-katalog: kilitliSureler [120,140,150,180,260,420,620] · canonicalEase cubic-bezier(.22,1,.36,1)
       siniflar: acig-cikar (ortuk olan gorunur olur, 500ms medyan) · gel-otur (varis, 1000ms) · belir -->
  <rect width="640" height="248" rx="12" fill="#0E0D13"/>
  <rect x="0" y="0" width="640" height="32" rx="12" fill="#14131C"/>
  <rect x="0" y="20" width="640" height="12" fill="#14131C"/>
  <circle cx="20" cy="16" r="4.5" fill="#F4645D"/>
  <circle cx="37" cy="16" r="4.5" fill="#F9BD4F"/>
  <circle cx="54" cy="16" r="4.5" fill="#3FC84F"/>
  <text x="320" y="21" text-anchor="middle" fill="#8B8798" font-size="11.5">human-steps — the ask, found</text>

  <!-- LEFT: prose. the ask is in there, unreadable as an ask -->
  <text x="42" y="56" fill="#5C5870" font-size="9.5">PROSE</text>
  <rect x="40" y="64" width="252" height="118" rx="7" fill="#131220" stroke="#22202E"/>
  <g font-size="9.5" fill="#4E4A5E">
    <text x="52" y="84">I updated the config and tightened the retry</text>
    <text x="52" y="100">path. </text>
    <text x="86" y="100" fill="#6E6A80">You&#8217;ll need to add the API key at</text>
    <text x="52" y="116" fill="#6E6A80">some point,</text>
    <text x="124" y="116">then it should work end to end.</text>
    <text x="52" y="132">I also refactored the parser and dropped two</text>
    <text x="52" y="148">dead imports, so the whole thing reads</text>
    <text x="52" y="164">cleaner now. Ping me if anything looks off.</text>
  </g>
  <!-- acig-cikar: the buried ask surfaces for 420ms, then sinks back -->
  <rect x="84" y="90" width="196" height="13" rx="2.5" fill="#D97777" opacity="0">
    <animate attributeName="opacity" values="0;0.30;0.30;0" keyTimes="0;0.06;0.16;0.22" dur="9s" begin="0.6s"
             calcMode="spline" keySplines=".22 1 .36 1;0 0 1 1;.22 1 .36 1" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="106" width="72" height="13" rx="2.5" fill="#D97777" opacity="0">
    <animate attributeName="opacity" values="0;0.30;0.30;0" keyTimes="0;0.07;0.16;0.22" dur="9s" begin="0.6s"
             calcMode="spline" keySplines=".22 1 .36 1;0 0 1 1;.22 1 .36 1" repeatCount="indefinite"/>
  </rect>
  <text x="166" y="200" text-anchor="middle" fill="#D97777" font-size="9.5" opacity="0">one sentence, split across two lines
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.18;0.24" dur="9s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <!-- the lift: 420ms, canonicalEase -->
  <path d="M298 118 L 330 118" stroke="#2E2B40" stroke-width="1.2"/>
  <path d="M324 113 L 332 118 L 324 123" fill="none" stroke="#2E2B40" stroke-width="1.2"/>
  <circle r="3.2" fill="#E8B562" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.9;1" dur="420ms" begin="2.6s;11.6s" fill="freeze"/>
    <animate attributeName="cx" values="298;332" dur="420ms" begin="2.6s;11.6s" fill="freeze"
             calcMode="spline" keySplines=".22 1 .36 1"/>
    <animate attributeName="cy" values="118;118" dur="420ms" begin="2.6s;11.6s" fill="freeze"/>
  </circle>

  <!-- RIGHT: the same ask, as its own block. gel-otur, 180ms stagger -->
  <text x="350" y="56" fill="#5C5870" font-size="9.5">HUMAN STEPS</text>
  <rect x="348" y="64" width="252" height="118" rx="7" fill="#131220" stroke="#8FD6BD" stroke-opacity="0.3"/>
  <g font-size="9.5">
    <g opacity="0" transform="translate(0,5)">
      <text x="362" y="88" fill="#7FA8E0">1</text>
      <text x="380" y="88" fill="#D8D5E4">open platform.openai.com/api-keys</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.1s;12.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.1s;12.1s" fill="freeze"
                        calcMode="spline" keySplines=".22 1 .36 1"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="362" y="110" fill="#7FA8E0">2</text>
      <text x="380" y="110" fill="#D8D5E4">create a key, copy it</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.28s;12.28s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.28s;12.28s" fill="freeze"
                        calcMode="spline" keySplines=".22 1 .36 1"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="362" y="132" fill="#7FA8E0">3</text>
      <text x="380" y="132" fill="#D8D5E4">paste into ~/.config/app/.env</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.46s;12.46s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.46s;12.46s" fill="freeze"
                        calcMode="spline" keySplines=".22 1 .36 1"/>
    </g>
    <g opacity="0">
      <text x="380" y="156" fill="#5C5870" font-size="8.5">expected:</text>
      <text x="436" y="156" fill="#8FD6BD" font-size="8.5">key accepted</text>
      <animate attributeName="opacity" values="0;1" dur="260ms" begin="3.70s;12.70s" fill="freeze"
               calcMode="spline" keySplines=".22 1 .36 1"/>
    </g>
  </g>
  <!-- reset for the loop -->
  <rect x="348" y="64" width="252" height="118" rx="7" fill="#0E0D13" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="120ms" begin="8.9s;17.9s"/>
  </rect>

  <text x="320" y="216" text-anchor="middle" fill="#D8D5E4" font-size="11">The work did not change. What the human must do became findable.</text>
  <text x="320" y="234" text-anchor="middle" fill="#5C5870" font-size="9.5">never bury what you need from the human</text>
</svg>
