<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" font-family="'Cascadia Code','Consolas',monospace">
  <rect width="640" height="250" rx="12" fill="#0E0D13"/>
  <rect x="0" y="0" width="640" height="34" rx="12" fill="#14131C"/>
  <circle cx="20" cy="17" r="5" fill="#F4645D"/>
  <circle cx="38" cy="17" r="5" fill="#F9BD4F"/>
  <circle cx="56" cy="17" r="5" fill="#3FC84F"/>
  <text x="320" y="22" text-anchor="middle" fill="#8B8798" font-size="12">human-steps — buried vs surfaced</text>

  <!-- left: buried in prose -->
  <text x="24" y="58" fill="#8B8798" font-size="11">BEFORE — buried in prose</text>
  <rect x="22" y="66" width="286" height="112" rx="8" fill="#151420" stroke="#2A2838"/>
  <g font-size="10.5" fill="#6E6A80">
    <text x="34" y="86">I updated the config and adjusted the</text>
    <text x="34" y="102">retry logic. You&#8217;ll need to add the API key</text>
    <text x="34" y="118">at some point, then it should work. I also</text>
    <text x="34" y="134">refactored the parser and cleaned up the</text>
    <text x="34" y="150">imports, so the whole path is tidier now.</text>
    <text x="34" y="166">Let me know if anything looks off.</text>
  </g>
  <!-- the ask, hiding -->
  <rect x="88" y="92" width="196" height="14" rx="3" fill="#D97777" opacity="0.16">
    <animate attributeName="opacity" values="0.16;0.16;0.42;0.16;0.16" keyTimes="0;0.25;0.35;0.45;1" dur="11s" repeatCount="indefinite"/>
  </rect>
  <text x="165" y="196" text-anchor="middle" fill="#D97777" font-size="10.5">the one thing you must do is inside line 2
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.38;1" dur="11s" repeatCount="indefinite"/>
  </text>

  <!-- right: surfaced -->
  <text x="332" y="58" fill="#8B8798" font-size="11">AFTER — surfaced as its own block</text>
  <rect x="330" y="66" width="288" height="112" rx="8" fill="#151420" stroke="#8FD6BD" stroke-opacity="0.35"/>
  <text x="344" y="86" fill="#8FD6BD" font-size="11">HUMAN STEPS
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.50;1" dur="11s" repeatCount="indefinite"/>
  </text>
  <g font-size="10.5">
    <text x="344" y="108" fill="#7FA8E0">1</text>
    <text x="362" y="108" fill="#E9E7F0">open platform.openai.com/api-keys
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.58;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="344" y="128" fill="#7FA8E0">2</text>
    <text x="362" y="128" fill="#E9E7F0">create a key, copy it
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.66;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="344" y="148" fill="#7FA8E0">3</text>
    <text x="362" y="148" fill="#E9E7F0">paste into ~/.config/app/.env
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.74;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="362" y="166" fill="#8B8798" font-size="9.5">expected: &#8220;key accepted&#8221;
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.82;1" dur="11s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="320" y="222" text-anchor="middle" fill="#E9E7F0" font-size="11.5">The work did not change. What the human must do became findable.</text>
  <text x="320" y="240" text-anchor="middle" fill="#5C5870" font-size="10">never bury what you need from the human</text>
</svg>
